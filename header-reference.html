<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RCS Print Header</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    :root {
      --purple: #4b148c;
      --purple-dark: #3b0b73;
      --orange: #ff7a00;
      --green: #22c55e;
      --black: #111111;
      --muted: #555555;
      --border: #eeeeee;
      --white: #ffffff;
      --container: 1280px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--black);
      background: var(--white);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .site-header {
      width: 100%;
      background: var(--white);
      position: relative;
      z-index: 20;
    }

    .header-container {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* TOP ANNOUNCEMENT BAR */
    .top-bar {
      width: 100%;
      height: 34px;
      color: var(--white);
      background: linear-gradient(90deg, var(--purple-dark) 0%, var(--purple) 52%, var(--purple-dark) 100%);
    }

    .top-bar__inner {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }

    .top-bar__left,
    .top-bar__right {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .top-bar__left {
      gap: 8px;
    }

    .top-bar__truck {
      font-size: 15px;
      line-height: 1;
      transform: translateY(-1px);
    }

    .top-bar__right {
      gap: 10px;
      flex-shrink: 0;
    }

    .top-bar__link {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .top-bar__link:hover,
    .top-bar__social:hover {
      opacity: 0.8;
      transform: translateY(-1px);
    }

    .top-bar__divider {
      color: rgba(255, 255, 255, 0.72);
      font-weight: 500;
    }

    .top-bar__socials {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar__social {
      width: 17px;
      height: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* MAIN NAVBAR */
    .main-header {
      width: 100%;
      height: 92px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .main-header__inner {
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .logo {
      width: 190px;
      min-width: 170px;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }

    .logo__letters {
      display: flex;
      align-items: center;
      gap: 1px;
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -5px;
      line-height: 0.82;
    }

    .logo__r {
      color: #2db54a;
    }

    .logo__c {
      color: var(--orange);
    }

    .logo__s {
      color: #6638c7;
    }

    .logo__print-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 140px;
    }

    .logo__line {
      width: 22px;
      height: 2px;
      background: #252525;
      display: inline-block;
    }

    .logo__print {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #252525;
      transform: translateX(3px);
    }

    .main-nav {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 2.55vw, 34px);
      height: 100%;
    }

    .main-nav__link,
    .main-nav__button {
      height: 92px;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 600;
      color: var(--black);
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .main-nav__link::after,
    .main-nav__button::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      border-radius: 10px 10px 0 0;
      background: var(--purple);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.22s ease;
    }

    .main-nav__link:hover::after,
    .main-nav__button:hover::after,
    .main-nav__link.is-active::after {
      transform: scaleX(1);
    }

    .main-nav__button i {
      font-size: 11px;
      margin-top: 2px;
    }

    .nav-dropdown {
      position: relative;
      height: 92px;
      display: flex;
      align-items: center;
    }

    .nav-dropdown__menu {
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      width: 230px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--white);
      box-shadow: 0 18px 45px rgba(17, 17, 17, 0.12);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -8px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }

    .nav-dropdown:hover .nav-dropdown__menu,
    .nav-dropdown:focus-within .nav-dropdown__menu {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .nav-dropdown__menu a {
      display: block;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      color: var(--black);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-dropdown__menu a:hover {
      background: #f6f0ff;
      color: var(--purple);
    }

    .header-actions {
      width: 190px;
      min-width: 170px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 24px;
      flex-shrink: 0;
    }

    .header-action {
      position: relative;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--black);
      font-size: 22px;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .header-action:hover {
      color: var(--purple);
      transform: translateY(-1px);
    }

    .cart-badge {
      position: absolute;
      top: -12px;
      right: -12px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--orange);
      color: var(--white);
      border: 2px solid var(--white);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .mobile-menu-toggle {
      display: none;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--black);
      font-size: 21px;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .mobile-menu-toggle:hover {
      background: #f7f3ff;
      color: var(--purple);
      border-color: #e6d7ff;
    }

    .mobile-menu {
      display: none;
      width: 100%;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 14px 30px rgba(17, 17, 17, 0.08);
    }

    .mobile-menu__inner {
      padding: 10px 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mobile-menu a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 0;
      color: var(--black);
      border-bottom: 1px solid #f1f1f1;
      font-size: 14px;
      font-weight: 500;
    }

    .mobile-menu a:hover {
      color: var(--purple);
    }

    .mobile-menu__actions {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-top: 16px;
    }

    .mobile-menu.is-open {
      display: block;
    }

    @media (max-width: 1100px) {
      .header-container {
        padding: 0 20px;
      }

      .logo,
      .header-actions {
        width: 160px;
        min-width: 145px;
      }

      .main-nav {
        gap: 20px;
      }

      .main-nav__link,
      .main-nav__button {
        font-size: 13px;
      }

      .header-actions {
        gap: 18px;
      }
    }

    @media (max-width: 900px) {
      .top-bar__inner {
        gap: 12px;
      }

      .top-bar__right {
        gap: 8px;
      }

      .top-bar__socials {
        gap: 8px;
      }

      .logo,
      .header-actions {
        width: auto;
        min-width: 0;
      }

      .main-nav,
      .header-actions .header-action {
        display: none;
      }

      .mobile-menu-toggle {
        display: inline-flex;
      }
    }

    @media (max-width: 768px) {
      .top-bar {
        height: auto;
        min-height: 34px;
      }

      .top-bar__inner {
        height: auto;
        min-height: 34px;
        justify-content: center;
        text-align: center;
        white-space: normal;
        font-size: 11px;
        padding-top: 6px;
        padding-bottom: 6px;
      }

      .top-bar__right {
        display: none;
      }

      .main-header,
      .main-header__inner {
        height: 68px;
      }

      .logo__letters {
        font-size: 42px;
        letter-spacing: -4px;
      }

      .logo__print-row {
        width: 112px;
        margin-top: 6px;
        gap: 6px;
      }

      .logo__line {
        width: 18px;
      }

      .logo__print {
        font-size: 11px;
        letter-spacing: 6px;
      }

      .mobile-menu__inner {
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    @media (max-width: 360px) {
      .header-container {
        padding: 0 14px;
      }

      .top-bar__inner {
        font-size: 10px;
      }

      .logo__letters {
        font-size: 38px;
      }

      .mobile-menu-toggle {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="top-bar">
      <div class="header-container top-bar__inner">
        <div class="top-bar__left">
          <span class="top-bar__truck" aria-hidden="true">🚚</span>
          <span>Free Delivery in Rajkot on All Orders Above ₹999</span>
        </div>

        <div class="top-bar__right" aria-label="Quick links">
          <a class="top-bar__link" href="#">Track Order</a>
          <span class="top-bar__divider" aria-hidden="true">|</span>
          <a class="top-bar__link" href="#">Help Center</a>
          <span class="top-bar__divider" aria-hidden="true">|</span>
          <div class="top-bar__socials" aria-label="Social links">
            <a class="top-bar__social" href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a class="top-bar__social" href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a class="top-bar__social" href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
          </div>
        </div>
      </div>
    </div>

    <div class="main-header">
      <div class="header-container main-header__inner">
        <a class="logo" href="#" aria-label="RCS Print home">
          <span class="logo__letters" aria-hidden="true">
            <span class="logo__r">R</span><span class="logo__c">C</span><span class="logo__s">S</span>
          </span>
          <span class="logo__print-row" aria-hidden="true">
            <span class="logo__line"></span>
            <span class="logo__print">PRINT</span>
            <span class="logo__line"></span>
          </span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a class="main-nav__link is-active" href="#">Home</a>

          <div class="nav-dropdown">
            <button class="main-nav__button" type="button" aria-expanded="false">
              Products <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </button>
            <div class="nav-dropdown__menu" aria-label="Products submenu">
              <a href="#">Business Cards</a>
              <a href="#">Brochures</a>
              <a href="#">Flyers</a>
              <a href="#">Banners</a>
            </div>
          </div>

          <a class="main-nav__link" href="#">About Us</a>
          <a class="main-nav__link" href="#">Contact Us</a>
          <a class="main-nav__link" href="#">Blog</a>
          <a class="main-nav__link" href="#">My Account</a>
        </nav>

        <div class="header-actions" aria-label="Header actions">
          <a class="header-action" href="#" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
          <a class="header-action" href="#" aria-label="Account"><i class="fa-regular fa-user"></i></a>
          <a class="header-action" href="#" aria-label="Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge">2</span>
          </a>

          <button class="mobile-menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobileMenu">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </div>
    </div>

    <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile navigation">
      <div class="mobile-menu__inner">
        <a href="#">Home</a>
        <a href="#">Products <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
        <a href="#">Blog</a>
        <a href="#">My Account</a>

        <div class="mobile-menu__actions" aria-label="Mobile actions">
          <a class="header-action" href="#" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
          <a class="header-action" href="#" aria-label="Account"><i class="fa-regular fa-user"></i></a>
          <a class="header-action" href="#" aria-label="Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge">2</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <script>
    const menuButton = document.querySelector('.mobile-menu-toggle');
    const mobileMenu = document.querySelector('#mobileMenu');

    menuButton.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.innerHTML = isOpen
        ? '<i class="fa-solid fa-xmark"></i>'
        : '<i class="fa-solid fa-bars"></i>';
    });
  </script>
</body>
</html>
