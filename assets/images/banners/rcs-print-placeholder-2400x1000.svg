<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1000" viewBox="0 0 2400 1000" role="img" aria-labelledby="title desc">
  <title id="title">RCS Graphic premium printing banner placeholder</title>
  <desc id="desc">A colorful 2400 by 1000 print studio banner with mobile-safe centered text and print product visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.44" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#43178d"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="2400" height="1000" fill="url(#bg)"/>
  <circle cx="2150" cy="160" r="320" fill="#bbf7d0" opacity="0.42"/>
  <circle cx="186" cy="858" r="310" fill="#fed7aa" opacity="0.52"/>
  <circle cx="1286" cy="124" r="180" fill="#ede9fe" opacity="0.72"/>

  <g opacity="0.6">
    <circle cx="380" cy="140" r="12" fill="#22c55e"/>
    <circle cx="476" cy="170" r="8" fill="#ff8a1f"/>
    <circle cx="1240" cy="835" r="10" fill="#6d28d9"/>
    <circle cx="2054" cy="780" r="13" fill="#ff8a1f"/>
    <rect x="330" y="785" width="34" height="34" rx="10" fill="#6d28d9" transform="rotate(-16 347 802)"/>
    <rect x="1180" y="196" width="24" height="24" rx="7" fill="#22c55e" transform="rotate(20 1192 208)"/>
  </g>

  <!-- Mobile-safe copy zone: keep important copy roughly within x=420..1280, y=220..710. -->
  <g font-family="Poppins, Inter, Arial, sans-serif">
    <g transform="translate(440 210)">
      <rect x="0" y="0" width="366" height="58" rx="29" fill="#ffffff" filter="url(#softShadow)"/>
      <circle cx="34" cy="29" r="11" fill="#22c55e"/>
      <circle cx="66" cy="29" r="11" fill="#ff8a1f"/>
      <text x="98" y="38" font-size="27" font-weight="800" letter-spacing="3" fill="#4b148c">PREMIUM PRINT STUDIO</text>
    </g>

    <text x="440" y="385" font-size="96" line-height="1" font-weight="900" letter-spacing="-4" fill="#071225">Print That</text>
    <text x="440" y="495" font-size="112" line-height="1" font-weight="900" letter-spacing="-5" fill="#071225">Grows Your</text>
    <text x="440" y="607" font-size="112" line-height="1" font-weight="900" letter-spacing="-5" fill="#ea580c">Brand</text>

    <text x="444" y="688" font-size="40" font-weight="700" fill="#334155">Business Cards • Flyers • Brochures • Banners</text>

    <g transform="translate(440 735)">
      <rect x="0" y="0" width="284" height="76" rx="20" fill="url(#orange)" filter="url(#softShadow)"/>
      <text x="142" y="50" text-anchor="middle" font-size="34" font-weight="900" fill="#ffffff">Order Online</text>
    </g>
    <g transform="translate(754 735)">
      <rect x="0" y="0" width="276" height="76" rx="20" fill="#ffffff" stroke="#d8b4fe" stroke-width="3"/>
      <text x="138" y="50" text-anchor="middle" font-size="32" font-weight="900" fill="#4b148c">Fast Delivery</text>
    </g>
  </g>

  <!-- Product cards kept inside the center-right safe area so mobile cover crop still looks intentional. -->
  <g filter="url(#shadow)">
    <g transform="translate(1395 210) rotate(-8)">
      <rect width="390" height="250" rx="28" fill="url(#purple)"/>
      <rect x="34" y="38" width="168" height="24" rx="12" fill="#ffffff" opacity="0.95"/>
      <rect x="34" y="82" width="262" height="16" rx="8" fill="#ffffff" opacity="0.55"/>
      <rect x="34" y="112" width="212" height="16" rx="8" fill="#ffffff" opacity="0.4"/>
      <circle cx="311" cy="170" r="54" fill="#ff8a1f"/>
      <text x="311" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">R</text>
    </g>
    <g transform="translate(1646 348) rotate(7)">
      <rect width="430" height="292" rx="32" fill="#ffffff"/>
      <rect x="32" y="34" width="366" height="122" rx="24" fill="url(#green)"/>
      <rect x="32" y="184" width="250" height="22" rx="11" fill="#111827" opacity="0.88"/>
      <rect x="32" y="226" width="315" height="18" rx="9" fill="#94a3b8"/>
      <rect x="32" y="258" width="226" height="18" rx="9" fill="#cbd5e1"/>
    </g>
    <g transform="translate(1322 585) rotate(4)">
      <rect width="520" height="232" rx="34" fill="#ffffff"/>
      <rect x="34" y="32" width="122" height="168" rx="22" fill="url(#orange)"/>
      <rect x="188" y="44" width="236" height="28" rx="14" fill="#4b148c"/>
      <rect x="188" y="100" width="286" height="18" rx="9" fill="#64748b"/>
      <rect x="188" y="136" width="230" height="18" rx="9" fill="#94a3b8"/>
      <rect x="188" y="172" width="168" height="18" rx="9" fill="#cbd5e1"/>
    </g>
  </g>

  <g transform="translate(1985 180)" opacity="0.94" filter="url(#softShadow)">
    <rect x="0" y="0" width="190" height="190" rx="95" fill="url(#orange)"/>
    <text x="95" y="82" text-anchor="middle" font-family="Poppins, Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">FREE</text>
    <text x="95" y="124" text-anchor="middle" font-family="Poppins, Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff">DESIGN</text>
  </g>

  <!-- Subtle safe-area guide hidden by default; uncomment while editing designs. -->
  <!-- <rect x="336" y="120" width="1728" height="760" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="28 22" opacity="0.5"/> -->
</svg>
